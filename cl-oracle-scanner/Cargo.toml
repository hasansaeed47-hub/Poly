[package]
name    = "lag_scanner"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio            = { version = "1",  features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util     = "0.3"
reqwest          = { version = "0.11", features = ["json"] }
serde            = { version = "1",  features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
dashmap          = "5"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
statrs           = "0.16"
anyhow           = "1"
chrono           = { version = "0.4", features = ["serde"] }
tokio-retry      = "0.3"
url              = "2"
dotenvy          = "0.15"

# -- Crypto / signing (EIP-712 order signing + HMAC L2 auth) --
k256             = { version = "0.13", features = ["ecdsa"] }
sha3             = "0.10"              # keccak256
sha2             = "0.10"              # HMAC-SHA256
hmac             = "0.12"
base64           = "0.22"
hex              = "0.4"
rand             = "0.8"

[[bin]]
name = "test_order"
path = "src/bin/test_order.rs"

[dev-dependencies]
tempfile = "3"
