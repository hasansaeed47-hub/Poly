# Lag Scanner — external config
# All thresholds here, nothing hardcoded in binary

[feed]
# Assets to scan
# Only assets with Chainlink feeds on Polymarket RTDS
assets = ["btc", "eth", "sol"]

# Window timeframes in minutes
timeframes = [5, 15]

# Polymarket CLOB REST base (for batch book fetches)
clob_rest    = "https://clob.polymarket.com"

# Polymarket CLOB WebSocket (order book updates)
clob_ws      = "wss://ws-subscriptions-clob.polymarket.com/ws/market"

# Polymarket live data WebSocket (CL prices)
live_ws      = "wss://ws-live-data.polymarket.com"

# Gamma API (market discovery)
gamma_api    = "https://gamma-api.polymarket.com"

# Batch size: max token IDs per single book REST request
book_batch_size = 20

# Minimum ms between REST requests (throttle guard)
rest_throttle_ms = 500

# Book warmup: wait this many seconds after WS connect before trading
book_warmup_secs = 5

# Max seconds after window_start to still capture open_price reliably
max_open_delay = 5.0

[scan]
# Scan tick interval in milliseconds
tick_ms = 500

# --- Per-timeframe scan parameters ---

[scan_5m]
# Sigma estimation: rolling window in seconds (3 minutes for 5m windows)
sigma_window_secs = 180
# Seconds after window_end before settling (wait for CL oracle confirmation)
settle_delay_secs = 10

[scan_15m]
# Sigma estimation: rolling window in seconds (10 minutes for 15m windows)
sigma_window_secs = 600
# Seconds after window_end before settling
settle_delay_secs = 15

[paper]
# Stake per trade in USD (paper only)
stake = 5.0

# Taker fee rate (Polymarket curve approximation)
taker_fee_rate = 0.015

# Maker fee rate (unused — scanner is always taker)
maker_fee_rate = 0.0

# ==============================================================================
# CONFIGS — 5 strategies per timeframe, each independently paper-traded
#
# Each config specifies:
#   name          — unique identifier (appears in logs)
#   tf            — timeframe in minutes (5 or 15) — ONLY processes matching markets
#   min_edge      — minimum fee-adjusted edge to enter (fair - book×(1+fee))
#   max_secs_left — max seconds remaining in window to consider entry
#   min_secs      — min seconds remaining (skip near-expiry noise)
#   stop_loss     — exit if current fair drops below entry price
#   take_profit   — exit if book reprices to fair_at_entry
# ==============================================================================

# --- 5-Minute Configs ---
# 5m windows: faster decay, tighter edges, allow entries closer to expiry

[configs.c1]
name           = "5M_BASE"
tf             = 5
min_edge       = 0.08
max_secs_left  = 270
min_secs       = 20
stop_loss      = false
take_profit    = false

[configs.c2]
name           = "5M_LATE"
tf             = 5
min_edge       = 0.08
max_secs_left  = 90
min_secs       = 15
