# CL Sniper v3.0 — Hybrid Live Execution Config
# All thresholds here — nothing hardcoded in binary
#
# If private_key is not set (here or via env vars), runs in PAPER mode.

# ── WALLET / API CREDENTIALS ─────────────────────────────────────────
# Place your keys directly here, or use env vars / .env as fallback.
# Config.toml takes priority over env vars.

[wallet]
# Polygon wallet private key (required for live execution)
# private_key  = "0x..."

# L2 API credentials (from Polymarket CLOB dashboard or auto-derived)
# api_key      = "..."
# api_secret   = "..."
# passphrase   = "..."

# Optional overrides
# api_url      = "https://clob.polymarket.com"
# neg_risk     = false

[feed]
# Assets with Chainlink feeds on Polymarket RTDS
assets = ["btc", "eth", "sol", "xrp"]

# Window timeframes in minutes
timeframes = [5, 15]

# Polymarket CLOB REST base (batch book fetches)
clob_rest    = "https://clob.polymarket.com"

# Polymarket CLOB WebSocket (order book updates — primary)
clob_ws      = "wss://ws-subscriptions-clob.polymarket.com/ws/market"

# Polymarket live data WebSocket (CL oracle prices)
live_ws      = "wss://ws-live-data.polymarket.com"

# Binance aggTrade WebSocket (cross-validation)
bn_ws        = "wss://stream.binance.com:9443/ws"

# Gamma API (market discovery)
gamma_api    = "https://gamma-api.polymarket.com"

# Batch size: max token IDs per single book REST request
book_batch_size = 20

# Minimum ms between REST requests (throttle guard)
rest_throttle_ms = 500

# Book warmup: wait this many seconds after WS connect before trading
book_warmup_secs = 5

# Max seconds after window_start to still capture open_price reliably
max_open_delay = 5.0

[scan]
# Scan tick interval in milliseconds (500ms active, 1000ms idle — auto)
tick_ms = 500

# ==============================================================================
# EXECUTION PARAMETERS — proven from cl-sniper-10mar (v2.0, 100% WR day)
# ==============================================================================

[exec]
# Stake per trade per engine
stake = 5.0

# Cumulative drawdown kill switch
max_dd = 50.0

# Stop-loss: bid <= this fraction of fill price
sl_pct = 0.50

# SL confirmation: opposing side bid must be >= this to confirm flip is real
sl_confirm_bid = 0.80

# Taker slippage (added to ask for taker orders)
slip = 0.005

# Maker chase: ticks before switching to taker (4 ticks x 500ms = 2s)
maker_chase_ticks = 4

# Settlement delay: seconds after window_end to wait for CLOB resolution
settle_delay_secs = 8

# Regime filter: 1h range below this % = chop, skip
regime_thresh = 0.3

# Binance contra-momentum filter threshold (%)
bn_contra_thresh = 0.02

# CL fade filter threshold (%)
cl_fade_thresh = 0.03

# BN lookback (seconds) for contra filter
bn_contra_secs = 15

# CL lookback (seconds) for fade filter
cl_fade_secs = 10

# ==============================================================================
# ENGINES — 5 engines matching proven 10-Mar configuration
#
# A: 5m sniper  — low delta (0.04%), continuity=4 ticks, all filters
# B: 5m D1      — high delta (0.15%), instant, all filters
# C: 15m sniper — low delta (0.04%), continuity=4 ticks, all filters
# D: 15m D1     — high delta (0.15%), instant, all filters
# E: late scalp — book-price driven, no filters, last 25s only
#
# Stdev scaling: delta thresholds auto-scale per asset volatility
#   BTC: 1.000x  ETH: 1.162x  SOL: 1.479x  XRP: 2.635x
# ==============================================================================

[engines.a]
id              = "A"
tf              = 5
delta           = 0.04
continuity      = 4
bn_contra       = true
cl_fade         = true
regime          = true
is_late_scalper = false
entry_start     = 57
taker_deadline  = 44
min_entry       = 0.88
max_entry       = 0.98

[engines.b]
id              = "B"
tf              = 5
delta           = 0.15
continuity      = 0
bn_contra       = true
cl_fade         = true
regime          = true
is_late_scalper = false
entry_start     = 57
taker_deadline  = 44
min_entry       = 0.88
max_entry       = 0.98

[engines.c]
id              = "C"
tf              = 15
delta           = 0.04
continuity      = 4
bn_contra       = true
cl_fade         = true
regime          = true
is_late_scalper = false
entry_start     = 57
taker_deadline  = 44
min_entry       = 0.88
max_entry       = 0.98

[engines.d]
id              = "D"
tf              = 15
delta           = 0.15
continuity      = 0
bn_contra       = true
cl_fade         = true
regime          = true
is_late_scalper = false
entry_start     = 57
