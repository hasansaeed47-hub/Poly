name: polybot
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  # Scientific core
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.12
  - scikit-learn>=1.4
  - statsmodels>=0.14
  # Visualization
  - matplotlib>=3.8
  - seaborn>=0.13
  - plotly>=5.18
  # Notebook
  - jupyter
  - jupyterlab
  - ipywidgets
  # Data handling
  - orjson>=3.9
  - requests>=2.31
  - websocket-client>=1.7
  - aiohttp>=3.9
  # Database
  - sqlalchemy>=2.0
  # Performance
  - numba>=0.59
  - line_profiler
  - memory_profiler
  # Dev tools
  - pytest>=8.0
  - black
  - ruff
  - mypy
  # pip-only packages
  - pip:
    - py-clob-client
    - python-dotenv
    - ccxt>=4.0
    - ta>=0.11
    - schedule>=1.2
    - websockets>=12.0
