# Oracle Sniper New — CL-Leading State Machine
# 15th March 2026

[wallet]
private_key    = ""
funder_address = ""

[feed]
assets     = ["btc", "eth"]
timeframes = [5, 15]

clob_rest  = "https://clob.polymarket.com"
live_ws    = "wss://ws-live-data.polymarket.com"
gamma_api  = "https://gamma-api.polymarket.com"

rest_throttle_ms = 250
book_warmup_secs = 5
book_stale_secs  = 1.5

[scan]
tick_ms            = 250
sigma_window_secs  = 300
min_secs           = 90

# ── Lag Detection ───────────────────────────────────────────────────────
# Signal: CL moves → PM book stale → buy gap. BN = confirmation only.
[lag]
min_cl_move_pct     = 0.035  # CL must move by >= 0.035% to trigger
min_edge            = 0.08   # fair_cl - fill_price >= 8c
min_book_gap        = 0.05   # fair_cl - best_ask >= 5c (book staleness)
min_bn_momentum     = 0.0003 # BN must confirm direction (>= 0.03%)
min_secs_left       = 90     # don't enter below T-90s
max_secs_left       = 600    # don't enter above T-10min
max_sigma           = 0.80   # skip if sigma > 80%
min_depth_multiple  = 1.0    # book depth >= 1x stake
min_entry_price     = 0.40   # market must partially agree (no 30c garbage)
max_entry_price     = 0.88   # need room for 10c TP
min_bn_flow_confirm = 0.05   # BN flow must confirm direction

# ── Strategy (State Machine) ───────────────────────────────────────────
# OPEN → BREAKEVEN → TRAILING → EXIT
[strategy]
stake              = 5.0     # USD per position
maker_chase_ticks  = 1       # chase 1 tick then taker
chase_interval_ms  = 300     # 300ms between chase ticks
max_concurrent     = 3       # max open positions
max_hold_secs      = 30.0    # time exit after 30s (60s if BN supports)
take_profit        = 0.10    # TP at entry + 10c
trail_activation   = 0.015   # activate trailing at entry + 1.5c
trail_distance     = 0.015   # trail 1.5c from high watermark
max_drawdown       = 25.0    # kill switch at -$25 net PnL
