[package]
name    = "sniper_final"
version = "1.0.0"
edition = "2024"

[dependencies]
# Official Polymarket SDK — handles EIP-712, HMAC auth, order building
polymarket-client-sdk = { version = "0.4", features = ["clob"] }
alloy    = { version = "1", features = ["signers", "signer-local", "contract", "provider-http"] }
rust_decimal       = "1"
rust_decimal_macros = "1"

# Async runtime & networking
tokio            = { version = "1",  features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util     = "0.3"
reqwest          = { version = "0.12", features = ["json"] }
serde            = { version = "1",  features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
dashmap          = "5"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1"
chrono           = { version = "0.4", features = ["serde"] }
tokio-retry      = "0.3"
dotenvy          = "0.15"

[[bin]]
name = "sniper_final"
path = "src/main.rs"

[[bin]]
name = "test_order"
path = "src/bin/test_order.rs"

[[bin]]
name = "check_approvals"
path = "src/bin/check_approvals.rs"

[[bin]]
name = "set_approvals"
path = "src/bin/set_approvals.rs"

[dev-dependencies]
tempfile = "3"
