[package]
name    = "lag_sniper"
version = "1.0.0"
edition = "2021"

[dependencies]
# Polymarket official SDK
polymarket-client-sdk = { version = "0.4.3", features = ["clob", "heartbeats", "tracing"] }
alloy    = { version = "1", features = ["signers", "signer-local", "sol-types"] }

# Async runtime
tokio    = { version = "1", features = ["full"] }

# HTTP + WebSocket
reqwest  = { version = "0.13", features = ["json"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"

# Data
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
dashmap     = "6"

# Math
statrs      = "0.18"
rust_decimal = "1"
rust_decimal_macros = "1"

# Logging
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Crypto (for CLOB L2 auth)
hmac     = "0.12"
sha2     = "0.10"
base64   = "0.22"

# Misc
anyhow   = "1"
url      = "2"
hex      = "0.4"
rand     = "0.8"
