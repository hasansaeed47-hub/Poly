[package]
name    = "cl_ab_test"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cl_ab_test"
path = "src/main.rs"

[dependencies]
anyhow            = "1"
base64            = "0.21"
dashmap           = "5"
futures-util      = "0.3"
hmac              = "0.12"
hex               = "0.4"
reqwest           = { version = "0.11", features = ["json"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
sha2              = "0.10"
tokio             = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["connect", "rustls-tls-webpki-roots"] }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url               = "=2.4.1"

[profile.release]
opt-level = 3
