[package]
name    = "arb_final"
version = "1.0.0"
edition = "2024"

[dependencies]
# Official Polymarket SDK — handles EIP-712, HMAC auth, order building
polymarket-client-sdk = { version = "0.4", features = ["clob"] }
alloy    = { version = "1", features = ["signers", "signer-local"] }

# Async runtime & networking
tokio            = { version = "1",  features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util     = "0.3"
reqwest          = { version = "0.12", features = ["json"] }
serde            = { version = "1",  features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
dashmap          = "5"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1"
dotenvy          = "0.15"
uuid             = "1"

[[bin]]
name = "arb_final"
path = "src/main.rs"

