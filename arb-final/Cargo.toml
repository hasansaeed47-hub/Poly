[package]
name    = "arb_final"
version = "1.0.0"
edition = "2024"

[dependencies]
# Shared modules from sniper-final (feeds, order, wallet)
sniper_final = { path = "../sniper-final" }

# Re-export SDK types needed for proxy config
polymarket-client-sdk = { version = "0.4", features = ["clob"] }

# Async runtime & networking
tokio            = { version = "1",  features = ["full"] }
reqwest          = { version = "0.12", features = ["json"] }
serde            = { version = "1",  features = ["derive"] }
serde_json       = "1"
toml             = "0.8"
dashmap          = "5"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1"
dotenvy          = "0.15"

[[bin]]
name = "arb_final"
path = "src/main.rs"
